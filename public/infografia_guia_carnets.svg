<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" style="background:#FFF9E6; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#1E293B" />
    </filter>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#0F172A" />
    </filter>
  </defs>

  <!-- HEADER -->
  <g transform="translate(960, 50)" text-anchor="middle">
    <text font-size="44" font-weight="900" fill="#0F172A" letter-spacing="-0.5">Crea els Teus Carnets amb QR: Guia Pas a Pas</text>
    <text y="42" font-size="20" font-weight="500" fill="#334155">Aquesta guia visual explica com utilitzar el Generador de Targetes QR creat per Àngel Agustí. Mostra el procés complet per</text>
    <text y="70" font-size="20" font-weight="500" fill="#334155">dissenyar, generar i muntar targetes en format A4 llestes per a impressió massiva per a escoles o associacions.</text>
  </g>

  <!-- FASE 1 TITLE -->
  <g transform="translate(60, 150)">
    <text font-size="28" font-weight="900" fill="#0F172A" letter-spacing="-0.5">FASE 1: El Procés de Creació</text>
  </g>

  <!-- FASE 1 PANEL 1: CARREGA I DISSENYA -->
  <g transform="translate(60, 170)">
    <rect width="570" height="390" rx="16" fill="#BFDBFE" stroke="#0F172A" stroke-width="4" filter="url(#cardShadow)"/>
    <text x="24" y="44" font-size="26" font-weight="800" fill="#0F172A">1. Carrega i Dissenya</text>
    
    <!-- Monitor graphic -->
    <rect x="24" y="65" width="310" height="260" rx="10" fill="#F8FAFC" stroke="#0F172A" stroke-width="3"/>
    <!-- Left preview: davant / darrere -->
    <rect x="36" y="80" width="80" height="95" rx="6" fill="#BAE6FD" stroke="#0F172A" stroke-width="2"/>
    <text x="76" y="195" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Davant</text>
    <rect x="36" y="210" width="80" height="95" rx="6" fill="#BAE6FD" stroke="#0F172A" stroke-width="2"/>
    <text x="76" y="325" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Darrere</text>

    <!-- Center work canvas -->
    <rect x="130" y="80" width="190" height="130" rx="6" fill="#FDE68A" stroke="#0F172A" stroke-width="2"/>
    <!-- Selection dashed box -->
    <rect x="200" y="100" width="70" height="70" rx="4" fill="#FFFFFF" fill-opacity="0.8" stroke="#0284C7" stroke-width="3" stroke-dasharray="6,4"/>
    <polygon points="270,170 285,185 278,187 282,197 277,199 273,189 266,194" fill="#0F172A"/>

    <!-- Speech bubble -->
    <path d="M 360,75 Q 360,60 380,60 L 530,60 Q 550,60 550,80 L 550,190 Q 550,210 530,210 L 440,210 L 410,240 L 420,210 L 380,210 Q 360,210 360,190 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
    <text x="455" y="105" font-size="17" font-weight="600" fill="#0F172A" text-anchor="middle">Puja les imatges del</text>
    <text x="455" y="130" font-size="17" font-weight="600" fill="#0F172A" text-anchor="middle">davant i del darrere, i</text>
    <text x="455" y="155" font-size="17" font-weight="600" fill="#0F172A" text-anchor="middle">dibuixa el requadre</text>
    <text x="455" y="180" font-size="17" font-weight="600" fill="#0F172A" text-anchor="middle">amb QR transparent.</text>

    <!-- Character avatar -->
    <circle cx="430" cy="310" r="45" fill="#FED7AA" stroke="#0F172A" stroke-width="3"/>
    <path d="M 390,300 Q 430,260 470,300" fill="#92400E"/>
    <circle cx="415" cy="305" r="4" fill="#0F172A"/>
    <path d="M 425,325 Q 435,335 445,325" stroke="#0F172A" stroke-width="2" fill="none"/>
  </g>

  <!-- FASE 1 PANEL 2: CONFIGURA LA SÈRIE -->
  <g transform="translate(675, 170)">
    <rect width="570" height="390" rx="16" fill="#DDD6FE" stroke="#0F172A" stroke-width="4" filter="url(#cardShadow)"/>
    <text x="24" y="44" font-size="26" font-weight="800" fill="#0F172A">2. Configura la Sèrie</text>

    <!-- App config box -->
    <rect x="24" y="65" width="290" height="260" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
    <!-- Mock input 1 -->
    <text x="40" y="100" font-size="16" font-weight="700" fill="#0F172A">Prefix</text>
    <rect x="40" y="110" width="110" height="40" rx="6" fill="#F1F5F9" stroke="#0F172A" stroke-width="2"/>
    <text x="50" y="136" font-size="18" font-weight="800" fill="#0284C7">2024-</text>

    <!-- Mock input 2 -->
    <text x="170" y="100" font-size="16" font-weight="700" fill="#0F172A">Quantitat</text>
    <rect x="170" y="110" width="110" height="40" rx="6" fill="#FEF08A" stroke="#0F172A" stroke-width="2"/>
    <text x="185" y="136" font-size="18" font-weight="800" fill="#0F172A">50</text>

    <!-- Code chip preview -->
    <rect x="70" y="190" width="170" height="60" rx="30" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
    <text x="155" y="228" font-size="20" font-weight="900" fill="#0F172A" text-anchor="middle">2024-049</text>

    <!-- Speech bubble -->
    <path d="M 330,80 Q 330,65 350,65 L 530,65 Q 550,65 550,85 L 550,210 Q 550,230 530,230 L 450,230 L 410,260 L 420,230 L 350,230 Q 330,230 330,210 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
    <text x="440" y="110" font-size="17" font-weight="600" fill="#0F172A" text-anchor="middle">Defineix el prefix</text>
    <text x="440" y="135" font-size="17" font-weight="600" fill="#0F172A" text-anchor="middle">i quantitat. L'app</text>
    <text x="440" y="160" font-size="17" font-weight="600" fill="#0F172A" text-anchor="middle">recorda l'últim</text>
    <text x="440" y="185" font-size="17" font-weight="600" fill="#0F172A" text-anchor="middle">número generat!</text>

    <!-- Character 2 -->
    <circle cx="450" cy="310" r="45" fill="#FED7AA" stroke="#0F172A" stroke-width="3"/>
    <path d="M 410,300 Q 450,260 490,300" fill="#1E293B"/>
    <circle cx="440" cy="305" r="4" fill="#0F172A"/>
    <path d="M 445,325 Q 455,335 465,325" stroke="#0F172A" stroke-width="2" fill="none"/>
  </g>

  <!-- FASE 1 PANEL 3: GENERA I DESCARREGA EL PDF -->
  <g transform="translate(1290, 170)">
    <rect width="570" height="390" rx="16" fill="#FED7AA" stroke="#0F172A" stroke-width="4" filter="url(#cardShadow)"/>
    <text x="24" y="44" font-size="26" font-weight="800" fill="#0F172A">3. Genera i Descarrega el PDF</text>

    <!-- Big Generate Button -->
    <rect x="40" y="75" width="220" height="60" rx="12" fill="#38BDF8" stroke="#0F172A" stroke-width="3"/>
    <text x="150" y="114" font-size="24" font-weight="900" fill="#FFFFFF" stroke="#0F172A" stroke-width="1" text-anchor="middle">GENERA</text>

    <!-- PDF Icon -->
    <g transform="translate(290, 65)">
      <path d="M 0,0 L 50,0 L 70,20 L 70,75 L 0,75 Z" fill="#EF4444" stroke="#0F172A" stroke-width="3"/>
      <text x="35" y="48" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">PDF</text>
    </g>

    <!-- Progress bar -->
    <rect x="40" y="160" width="310" height="28" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
    <rect x="44" y="164" width="180" height="20" rx="6" fill="#F87171"/>
    <text x="40" y="210" font-size="14" font-weight="700" fill="#0F172A">0%</text>
    <text x="190" y="210" font-size="14" font-weight="700" fill="#0F172A">50%</text>
    <text x="315" y="210" font-size="14" font-weight="700" fill="#0F172A">100%</text>

    <!-- Sheet with 6 cards -->
    <g transform="translate(390, 80)">
      <rect width="130" height="175" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
      <text x="65" y="25" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle">A4</text>
      <!-- Row 1 -->
      <rect x="15" y="35" width="45" height="28" rx="3" fill="#BAE6FD" stroke="#0F172A" stroke-width="1.5"/>
      <rect x="60" y="35" width="45" height="28" rx="3" fill="#FED7AA" stroke="#0F172A" stroke-width="1.5"/>
      <!-- Row 2 -->
      <rect x="15" y="75" width="45" height="28" rx="3" fill="#BAE6FD" stroke="#0F172A" stroke-width="1.5"/>
      <rect x="60" y="75" width="45" height="28" rx="3" fill="#FED7AA" stroke="#0F172A" stroke-width="1.5"/>
      <!-- Row 3 -->
      <rect x="15" y="115" width="45" height="28" rx="3" fill="#BAE6FD" stroke="#0F172A" stroke-width="1.5"/>
      <rect x="60" y="115" width="45" height="28" rx="3" fill="#FED7AA" stroke="#0F172A" stroke-width="1.5"/>
    </g>

    <!-- Speech bubble explanation -->
    <path d="M 40,240 Q 40,230 55,230 L 495,230 Q 510,230 510,245 L 510,320 Q 510,335 495,335 L 55,335 Q 40,335 40,320 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
    <text x="275" y="270" font-size="17" font-weight="600" fill="#0F172A" text-anchor="middle">Crea un document A4 a punt per imprimir,</text>
    <text x="275" y="295" font-size="17" font-weight="600" fill="#0F172A" text-anchor="middle">amb una barra de progrés en temps real per fer-ne el seguiment.</text>
  </g>

  <!-- FASE 2 TITLE -->
  <g transform="translate(60, 600)">
    <text font-size="28" font-weight="900" fill="#0F172A" letter-spacing="-0.5">FASE 2: Consells Clau i Funcionalitats Útils</text>
  </g>

  <!-- FASE 2 PANEL 1: MEMÒRIA I EXPORTACIÓ -->
  <g transform="translate(60, 620)">
    <rect width="570" height="390" rx="16" fill="#FEF08A" stroke="#0F172A" stroke-width="4" filter="url(#cardShadow)"/>
    <text x="24" y="44" font-size="26" font-weight="800" fill="#0F172A">Memòria i Exportació</text>

    <!-- Screen graphic -->
    <rect x="24" y="65" width="280" height="200" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
    <path d="M 90,140 Q 90,110 120,110 Q 140,90 170,110 Q 200,110 200,140 Z" fill="#E2E8F0" stroke="#0F172A" stroke-width="2"/>
    <polygon points="145,150 145,125 135,125 150,110 165,125 155,125 155,150" fill="#0284C7"/>
    
    <!-- JSON file -->
    <rect x="205" y="130" width="80" height="70" rx="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="2.5"/>
    <text x="245" y="172" font-size="18" font-weight="900" fill="#D97706" text-anchor="middle">JSON</text>

    <!-- Speech bubble -->
    <path d="M 320,70 Q 320,55 340,55 L 530,55 Q 550,55 550,75 L 550,220 Q 550,240 530,240 L 450,240 L 410,270 L 420,240 L 340,240 Q 320,240 320,220 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
    <text x="435" y="100" font-size="17" font-weight="600" fill="#0F172A" text-anchor="middle">El navegador</text>
    <text x="435" y="125" font-size="17" font-weight="600" fill="#0F172A" text-anchor="middle">guarda les imatges</text>
    <text x="435" y="150" font-size="17" font-weight="600" fill="#0F172A" text-anchor="middle">automàticament i</text>
    <text x="435" y="175" font-size="17" font-weight="600" fill="#0F172A" text-anchor="middle">permet exportar</text>
    <text x="435" y="200" font-size="17" font-weight="600" fill="#0F172A" text-anchor="middle">en format JSON.</text>

    <!-- Character 3 -->
    <circle cx="160" cy="320" r="45" fill="#FED7AA" stroke="#0F172A" stroke-width="3"/>
    <path d="M 120,310 Q 160,270 200,310" fill="#78350F"/>
    <circle cx="150" cy="315" r="4" fill="#0F172A"/>
    <circle cx="170" cy="315" r="4" fill="#0F172A"/>
    <path d="M 150,335 Q 160,345 170,335" stroke="#0F172A" stroke-width="2" fill="none"/>
  </g>

  <!-- FASE 2 PANEL 2: MUNTATGE FÀCIL I RÀPID -->
  <g transform="translate(675, 620)">
    <rect width="570" height="390" rx="16" fill="#BAE6FD" stroke="#0F172A" stroke-width="4" filter="url(#cardShadow)"/>
    <text x="24" y="44" font-size="26" font-weight="800" fill="#0F172A">Muntatge Fàcil i Ràpid</text>

    <!-- Sheet with ruler and fold -->
    <rect x="30" y="80" width="250" height="150" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
    <line x1="155" y1="80" x2="155" y2="230" stroke="#EF4444" stroke-width="3" stroke-dasharray="6,4"/>
    <!-- Ruler -->
    <rect x="70" y="110" width="170" height="25" rx="4" fill="#FEF08A" stroke="#0F172A" stroke-width="2" transform="rotate(25, 70, 110)"/>

    <!-- Folded card sample -->
    <path d="M 60,260 L 110,240 L 140,290 L 90,310 Z" fill="#F87171" stroke="#0F172A" stroke-width="3"/>
    <path d="M 110,240 L 160,260 L 190,310 L 140,290 Z" fill="#60A5FA" stroke="#0F172A" stroke-width="3"/>

    <!-- Printer icon -->
    <rect x="210" y="270" width="90" height="50" rx="6" fill="#CBD5E1" stroke="#0F172A" stroke-width="3"/>
    <rect x="230" y="255" width="50" height="20" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>

    <!-- Speech bubble -->
    <path d="M 310,70 Q 310,55 330,55 L 530,55 Q 550,55 550,75 L 550,220 Q 550,240 530,240 L 450,240 L 410,270 L 420,240 L 330,240 Q 310,240 310,220 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
    <text x="430" y="95" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">Les cares es toquen.</text>
    <text x="430" y="120" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">Imprimeix en cartolina</text>
    <text x="430" y="145" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">gruixuda (180g-250g)</text>
    <text x="430" y="170" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">a escala 100%, plega</text>
    <text x="430" y="195" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">pel mig i plastifica.</text>
  </g>

  <!-- FASE 2 PANEL 3: EINA LLIURE I GRATUÏTA -->
  <g transform="translate(1290, 620)">
    <rect width="570" height="390" rx="16" fill="#BBF7D0" stroke="#0F172A" stroke-width="4" filter="url(#cardShadow)"/>
    <text x="24" y="44" font-size="26" font-weight="800" fill="#0F172A">Eina Lliure i Gratuïta</text>

    <!-- Shield Graphic -->
    <g transform="translate(50, 80)">
      <path d="M 0,0 L 100,0 C 100,70 60,110 50,130 C 40,110 0,70 0,0 Z" fill="#86EFAC" stroke="#0F172A" stroke-width="4"/>
      <path d="M 30,55 L 45,70 L 75,35" fill="none" stroke="#0F172A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- CC License Badge -->
    <g transform="translate(30, 240)">
      <rect width="210" height="55" rx="8" fill="#1E293B" stroke="#0F172A" stroke-width="3"/>
      <text x="105" y="35" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">CC BY-NC-SA 4.0</text>
    </g>

    <!-- Speech bubble -->
    <path d="M 270,70 Q 270,55 290,55 L 530,55 Q 550,55 550,75 L 550,230 Q 550,250 530,250 L 450,250 L 410,280 L 420,250 L 290,250 Q 270,250 270,230 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
    <text x="410" y="95" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">Ús educatiu o associatiu</text>
    <text x="410" y="120" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">100% gratuït, sense</text>
    <text x="410" y="145" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">finalitat comercial.</text>
    <text x="410" y="180" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">Llicència CC BY-NC-SA 4.0</text>
    <text x="410" y="205" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Autor: Àngel Agustí</text>
  </g>

  <!-- FOOTER BRAND -->
  <g transform="translate(1860, 1050)" text-anchor="end">
    <text font-size="14" font-weight="600" fill="#64748B">Creat amb VibeCoding • Àngel Agustí (aagust11@xtec.cat)</text>
  </g>
</svg>
