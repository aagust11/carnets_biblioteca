name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  # Permet executar el desplegament manualment des de GitHub Actions
  workflow_dispatch:

# Permisos necessaris per publicar a GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que dos desplegaments s'executin al mateix temps
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  # ============================================================
  # BUILD
  # ============================================================
  build:
    name: Compilar aplicació
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Baixar el codi del repositori
      # ----------------------------------------------------------
      - name: Baixar codi
        uses: actions/checkout@v6


      # ----------------------------------------------------------
      # Configurar Node.js
      # ----------------------------------------------------------
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      # ----------------------------------------------------------
      # Instal·lar dependències
      # ----------------------------------------------------------
      - name: Instal·lar dependències
        run: npm install --legacy-peer-deps


      # ----------------------------------------------------------
      # Configurar GitHub Pages
      # ----------------------------------------------------------
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5


      # ----------------------------------------------------------
      # Compilar aplicació
      #
      # En projectes Vite això genera normalment:
      #
      # /dist
      #
      # ----------------------------------------------------------
      - name: Compilar aplicació per a producció
        run: npm run build


      # ----------------------------------------------------------
      # Comprovar que s'ha generat la carpeta dist
      # ----------------------------------------------------------
      - name: Comprovar build
        run: |
          echo "Contingut generat:"
          ls -la
          echo ""
          echo "Contingut de dist:"
          ls -la dist


      # ----------------------------------------------------------
      # Pujar el build com a artefacte de GitHub Pages
      # ----------------------------------------------------------
      - name: Pujar artefacte per a GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist


  # ============================================================
  # DEPLOY
  # ============================================================
  deploy:
    name: Publicar a GitHub Pages

    # Només s'executa quan el build ha acabat correctament
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ----------------------------------------------------------
      # Publicar l'artefacte generat anteriorment
      # ----------------------------------------------------------
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
